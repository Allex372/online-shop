[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # Менше паралельних GraphQL-запитів до Strapi під час білду
  GATSBY_EXPERIMENTAL_QUERY_CONCURRENCY = "4"

[[redirects]]
  from = "/api/submit-order"
  to = "/.netlify/functions/submit-order"
  status = 200
  force = true
